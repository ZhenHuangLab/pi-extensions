name: Publish to npm

on:
  release:
    types: [published]

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Validate release and select npm dist-tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          if (typeof version !== "string" || version.length === 0) {
            throw new Error("package.json must contain a non-empty version.");
          }
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag ${JSON.stringify(process.env.RELEASE_TAG)} must equal v${version}.`);
          }
          const distTag = process.env.RELEASE_PRERELEASE === "true" || version.split("+")[0].includes("-")
            ? "next"
            : "latest";
          appendFileSync(process.env.GITHUB_OUTPUT, `dist_tag=${distTag}\n`);
          NODE

      - name: Install npm 11
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: |
          set -e
          node --check index.ts
          node --check transform.ts
          node --check render-worker.mjs

      - name: Publish to npm
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: npm publish --access public --tag "$NPM_DIST_TAG"
